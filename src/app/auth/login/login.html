<div class="min-h-screen w-full flex flex-col items-center justify-center relative overflow-hidden font-sans"
     style="background: linear-gradient(135deg, #8b1a1a 0%, #b91c1c 50%, #7f1d1d 100%);">

  <!-- Círculos decorativos de fondo -->
  <div class="absolute -top-32 -right-20 w-96 h-96 bg-white/10 rounded-full"></div>
  <div class="absolute -bottom-24 -left-24 w-72 h-72 bg-black/10 rounded-full"></div>

  <!-- Card de Login -->
  <div class="relative z-10 bg-white rounded-2xl shadow-2xl w-full max-w-sm px-9 py-10 text-center">

    <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-red-600 to-red-900 text-white font-bold text-xl flex items-center justify-center mx-auto mb-4 shadow-lg">
      SC
    </div>

    <h1 class="text-xl font-bold text-gray-900 mb-1">SetcomIT</h1>
    <p class="text-xs text-gray-500 mb-7">Sistema de Gestión de Clientes y Cobros</p>

    <form (ngSubmit)="onSubmit()" novalidate class="text-left">

      <div class="mb-4">
        <label for="usuario" class="block text-xs font-semibold text-gray-700 mb-1.5">Usuario</label>
        <input
          id="usuario"
          type="text"
          name="usuario"
          placeholder="admin"
          [(ngModel)]="usuario"
          [disabled]="cargando()"
          autocomplete="username"
          class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500 transition-all disabled:opacity-60"
        />
      </div>

      <div class="mb-5">
        <label for="password" class="block text-xs font-semibold text-gray-700 mb-1.5">Contraseña</label>
        <div class="relative">
          <input
            id="password"
            [type]="mostrarPassword() ? 'text' : 'password'"
            name="password"
            placeholder="••••••••"
            [(ngModel)]="password"
            [disabled]="cargando()"
            autocomplete="current-password"
            class="w-full px-3.5 py-2.5 pr-10 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500 transition-all disabled:opacity-60"
          />
          <button
            type="button"
            (click)="togglePassword()"
            class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-gray-400 hover:text-gray-600"
            [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
          </button>
        </div>
      </div>

      @if (errorMsg()) {
        <div class="mb-4 rounded-xl bg-red-50 border border-red-200 px-3.5 py-2.5 text-xs font-medium text-red-700">
          {{ errorMsg() }}
        </div>
      }

      <button
        type="submit"
        [disabled]="cargando()"
        class="w-full bg-red-700 hover:bg-red-800 disabled:opacity-60 disabled:cursor-not-allowed text-white text-sm font-semibold py-2.5 rounded-xl shadow-md transition-colors"
      >
        {{ cargando() ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>

    </form>
  </div>

  <p class="relative z-10 text-white/70 text-xs mt-6">© 2026 SetcomIT · Todos los derechos reservados</p>
</div>
