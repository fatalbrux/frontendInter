<div class="space-y-2">
<div class="flex items-center justify-between mb-2">
  <label class="block text-xs font-semibold text-gray-600">Ubicación en el mapa</label>
  <div class="flex items-center gap-2">
    <button type="button" (click)="usarUbicacionActual()"
      class="flex items-center gap-1.5 px-3 py-1.5 text-[11px] font-semibold text-gray-600 border border-gray-200 rounded-xl hover:bg-gray-50 transition-colors">
      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3" />
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
      </svg>
      Usar mi ubicación
    </button>

    <button type="button" (click)="activarModoEdicion()" [disabled]="modoEdicion"
      [ngClass]="modoEdicion
        ? 'bg-amber-50 text-amber-600 cursor-default'
        : 'text-red-600 border border-red-200 hover:bg-red-50'"
      class="flex items-center gap-1.5 px-3 py-1.5 text-[11px] font-semibold rounded-xl transition-colors">
      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 21s-6-5.686-6-10a6 6 0 1112 0c0 4.314-6 10-6 10z" />
        <circle cx="12" cy="11" r="2" />
      </svg>
      {{ modoEdicion ? 'Haz click en el mapa...' : 'Cambiar posición' }}
    </button>
  </div>
</div>

  <div #mapaContenedor class="w-full h-80 md:h-96 rounded-xl border border-gray-200 overflow-hidden"></div>

  <div class="grid grid-cols-2 gap-3">
    <div>
      <label class="block text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-1">Latitud</label>
      <input type="text" [ngModel]="latActual" (ngModelChange)="actualizarLatManual($event)" placeholder="-17.9833"
        class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs text-gray-700 focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500" />
    </div>
    <div>
      <label class="block text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-1">Longitud</label>
      <input type="text" [ngModel]="lngActual" (ngModelChange)="actualizarLngManual($event)" placeholder="-67.15"
        class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs text-gray-700 focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500" />
    </div>
  </div>
</div>
